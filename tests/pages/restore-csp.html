<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Politique stricte</title>
<meta http-equiv="Content-Security-Policy" content="style-src-attr 'none'">
<style>
html,body{margin:0;background:#fff}
.s{position:sticky;top:0;height:30px;width:200px;background:#ff00aa}
.f{position:fixed;width:80px;height:20px;background:#00ccff}
.f1{top:0;left:300px}.f2{bottom:0;left:300px}.f3{top:0;left:400px}
.z{height:4000px;background:#f1efea}
</style></head><body>
<div class="s" data-t="s-refuse" style="top: 33px; background: red; height: 200px"></div>
<div class="f f1" data-t="f-haut-refuse" style="display: none; opacity: .3"></div>
<div class="f f2" data-t="f-bas-refuse" style="display: none"></div>
<div class="f f3" data-t="f-script" id="js"></div>
<div class="z"></div>
<script>document.getElementById('js').style.opacity = '0.7';</script>
</body></html>
