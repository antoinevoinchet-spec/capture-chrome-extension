<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Page longue de test</title>
    <style>
      body { margin: 0; font: 17px/1.6 Georgia, serif; color: #222; background: #fff; }
      header { position: sticky; top: 0; height: 60px; display: flex; align-items: center; padding: 0 20px; font: 600 18px system-ui; color: #fff; background: #ff00aa; }
      .bar { position: fixed; left: 0; right: 0; bottom: 0; height: 40px; background: #00ccff; }
      main { max-width: 760px; margin: 0 auto; padding: 20px; }
      .lazy { height: 200px; margin: 24px 0; background: #cccccc; }
      .lazy.loaded { background: #22aa44; }
    </style>
  </head>
  <body>
    <header>En-tête collant</header>
    <main id="main"></main>
    <div class="bar"></div>
    <script>
      const main = document.getElementById('main');
      const filler = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. ';
      for (let s = 1; s <= 24; s++) {
        const h = document.createElement('h2');
        h.textContent = 'Section ' + s;
        main.append(h);
        for (let p = 1; p <= 6; p++) {
          const para = document.createElement('p');
          para.textContent = 'Section ' + s + ', paragraphe ' + p + '. ' + filler.repeat(3);
          main.append(para);
        }
        if (s % 2 === 0) {
          const block = document.createElement('div');
          block.className = 'lazy';
          main.append(block);
        }
      }
      // Imitation du chargement différé : un bloc passe au vert quand il entre à l'écran.
      const io = new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (e.isIntersecting) {
            e.target.classList.add('loaded');
            io.unobserve(e.target);
          }
        }
      });
      document.querySelectorAll('.lazy').forEach((el) => io.observe(el));
    </script>
  </body>
</html>
