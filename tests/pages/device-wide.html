<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- Sans initial-scale, et un contenu plus large que le téléphone : le navigateur dézoome pour tout montrer. -->
    <meta name="viewport" content="width=device-width" />
    <title>Page trop large</title>
    <style>
      html, body { margin: 0; background: #fff; }
      #wide { width: 600px; height: 3000px; background: linear-gradient(90deg, #eee 0 590px, rgb(200, 0, 200) 590px 600px); }
    </style>
  </head>
  <body><div id="wide"></div></body>
</html>
