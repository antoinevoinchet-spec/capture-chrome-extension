<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Application de test</title>
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; font: 16px/1.5 system-ui; }
      .top { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #333; }
      .side { position: fixed; top: 56px; bottom: 0; left: 0; width: 240px; background: #e6e6e6; }
      .scroller { position: absolute; top: 56px; right: 0; bottom: 0; left: 240px; overflow: auto; background: #fff; }
      .scroller h1 { position: sticky; top: 0; height: 50px; margin: 0; padding: 0 24px; font-size: 20px; line-height: 50px; color: #fff; background: #ff00aa; }
      .msg { padding: 12px 24px; border-bottom: 1px solid #ddd; }
    </style>
  </head>
  <body>
    <div class="top"></div>
    <div class="side"></div>
    <div class="scroller" id="scroller"><h1>Fil de discussion</h1></div>
    <script>
      const scroller = document.getElementById('scroller');
      for (let i = 1; i <= 300; i++) {
        const msg = document.createElement('div');
        msg.className = 'msg';
        msg.textContent = 'Message ' + i + ' : une réponse un peu longue pour remplir la ligne et vérifier le recollage des tranches.';
        scroller.append(msg);
      }
    </script>
  </body>
</html>
