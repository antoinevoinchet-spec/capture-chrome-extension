<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Bloc très haut</title>
    <style>
      html, body { margin: 0; background: #fff; font: 16px/1.5 system-ui; }
      #head { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #0000ff; z-index: 5; }
      #above { height: 400px; background: #f1efea; }
      #outer { margin: 0 100px; padding: 40px; background: #dfe7e2; }
      #inner { height: 3000px; background: repeating-linear-gradient(#ffd84d 0 100px, #22aa44 100px 200px); border-top: 20px solid #00ccff; border-bottom: 20px solid #ff00aa; }
      #leaf { width: 300px; height: 80px; margin: 0; background: #ffffff; }
      #below { height: 2000px; background: #e7ece8; }
      #sticky { position: sticky; top: 0; height: 50px; background: #aa00ff; z-index: 2; }
      #modal { position: fixed; top: 120px; left: 200px; width: 500px; height: 300px; background: #cc4400; z-index: 9; }
    </style>
  </head>
  <body>
    <div id="head"></div>
    <div id="above"></div>
    <div id="sticky"></div>
    <article id="outer">
      <div id="inner"><p id="leaf"></p></div>
    </article>
    <div id="below"></div>
    <script>
      const params = new URLSearchParams(location.search);
      if (params.has('modal')) document.body.insertAdjacentHTML('beforeend', '<div id="modal"></div>');
      if (params.has('bars')) document.head.insertAdjacentHTML('beforeend', '<style>::-webkit-scrollbar { width: 15px; height: 15px; } ::-webkit-scrollbar-thumb { background: #888; }</style>');
      if (params.has('lazy')) {
        // Un contenu paresseux au-dessus du bloc : il le repousse de 300 points quand on défile jusqu'à lui.
        document.getElementById('above').style.height = '1800px';
        const lazy = document.createElement('div');
        lazy.id = 'lazy';
        lazy.style.cssText = 'height: 1px; background: #333333';
        document.getElementById('above').after(lazy);
        new IntersectionObserver(([entry], observer) => {
          if (!entry.isIntersecting) return;
          lazy.style.height = '300px';
          observer.disconnect();
        }).observe(lazy);
      }
      const add = (html) => document.body.insertAdjacentHTML('beforeend', html);
      if (params.has('inside')) document.getElementById('above').insertAdjacentHTML('afterbegin', '<div id="box" style="height: 300px; overflow: auto; background: #fff"><div id="boxed" style="height: 2000px; background: #22aa44"></div></div>');
      if (params.has('tallfixed')) add('<div id="tallfixed" style="position: fixed; top: 100px; left: 0; width: 200px; height: 3000px; background: #cc4400; z-index: 9"></div>');
      if (params.has('wide')) document.getElementById('above').insertAdjacentHTML('afterbegin', '<div id="wide" style="width: 3000px; height: 200px; background: #22aa44"></div>');
      if (params.has('zero')) document.getElementById('above').insertAdjacentHTML('afterbegin', '<div id="zero" style="height: 0"></div>');
      if (params.has('invisible')) document.getElementById('above').insertAdjacentHTML('afterbegin', '<div id="unseen" style="height: 100px; visibility: hidden"></div><div id="gone" style="height: 100px; display: none"></div>');
      // Un bloc plus bas que l'écran, retiré par le site dès qu'on défile.
      if (params.has('vanish')) window.addEventListener('scroll', () => document.getElementById('below')?.remove());
      if (params.has('huge')) document.getElementById('inner').style.height = '101000px';
      const css = (text) => document.head.insertAdjacentHTML('beforeend', `<style>${text}</style>`);
      if (params.has('htmlscroll')) css('html { overflow-y: scroll; }');
      if (params.has('bodyhidden')) css('html, body { height: 100%; } body { overflow-x: hidden; }');
      if (params.has('snap')) css('html { scroll-snap-type: y mandatory; } #above, #outer, #below { scroll-snap-align: start; }');
      if (params.has('backtop')) {
        // Un bouton « retour en haut », affiché seulement après un peu de défilement.
        add('<div id="backtop" style="display: none; position: fixed; left: 300px; bottom: 20px; width: 200px; height: 60px; background: #123456; z-index: 7"></div>');
        addEventListener('scroll', () => (document.getElementById('backtop').style.display = scrollY > 1500 ? 'block' : 'none'));
      }
      // Chrome compense seul un contenu ajouté au-dessus de l'écran (ancrage du défilement), sauf si la page l'interdit.
      if (params.has('noanchor')) css('* { overflow-anchor: none; }');
      if (params.has('snapsmall')) {
        // De petites sections : un défilement aligné tomberait à côté de presque toutes les tranches.
        css('html { scroll-snap-type: y mandatory; } .section { height: 600px; scroll-snap-align: start; }');
        document.getElementById('inner').innerHTML = '<div class="section"></div>'.repeat(5);
      }
      if (params.has('childhead')) document.getElementById('outer').insertAdjacentHTML('afterbegin', '<div id="childhead" style="position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #0000ff; z-index: 5"></div><div id="childback" style="position: fixed; inset: 0; z-index: -1"></div>');
      if (params.has('tallwide')) add('<div id="tallwide" style="position: fixed; top: 100px; left: 0; width: 3000px; height: 3000px; background: #cc4400; z-index: 9"></div>');
      if (params.has('back')) {
        // Un fond fixe derrière la page, et un bloc transparent posé dessus.
        document.documentElement.style.background = 'transparent';
        document.body.style.background = 'transparent';
        document.getElementById('above').style.background = 'transparent';
        document.getElementById('above').insertAdjacentHTML('afterbegin', '<div id="clear" style="margin: 100px 0 0 100px; width: 300px; height: 100px"></div>');
        document.body.insertAdjacentHTML('beforeend', '<div id="back" style="position: fixed; inset: 0; z-index: -1; background: #a0d0ff"></div>');
      }
    </script>
  </body>
</html>
