<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Bloc très haut</title>
    <style>
      html, body { margin: 0; background: #fff; font: 16px/1.5 system-ui; }
      #head { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #0000ff; z-index: 5; }
      #above { height: 400px; background: #f1efea; }
      #outer { margin: 0 100px; padding: 40px; background: #dfe7e2; }
      #inner { height: 3000px; background: repeating-linear-gradient(#ffd84d 0 100px, #22aa44 100px 200px); border-top: 20px solid #00ccff; border-bottom: 20px solid #ff00aa; }
      #leaf { width: 300px; height: 80px; margin: 0; background: #ffffff; }
      #below { height: 2000px; background: #e7ece8; }
      #sticky { position: sticky; top: 0; height: 50px; background: #aa00ff; z-index: 2; }
      #modal { position: fixed; top: 120px; left: 200px; width: 500px; height: 300px; background: #cc4400; z-index: 9; }
    </style>
  </head>
  <body>
    <div id="head"></div>
    <div id="above"></div>
    <div id="sticky"></div>
    <article id="outer">
      <div id="inner"><p id="leaf"></p></div>
    </article>
    <div id="below"></div>
    <script>
      const params = new URLSearchParams(location.search);
      if (params.has('modal')) document.body.insertAdjacentHTML('beforeend', '<div id="modal"></div>');
      if (params.has('bars')) document.head.insertAdjacentHTML('beforeend', '<style>::-webkit-scrollbar { width: 15px; height: 15px; } ::-webkit-scrollbar-thumb { background: #888; }</style>');
      if (params.has('lazy')) {
        // Une image paresseuse au-dessus du bloc : elle le repousse quand on défile.
        const canvas = document.createElement('canvas');
        canvas.width = 800;
        canvas.height = 300;
        canvas.getContext('2d').fillRect(0, 0, 800, 300);
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.id = 'lazy';
        img.style.display = 'block';
        img.src = canvas.toDataURL();
        document.getElementById('above').style.height = '1800px';
        document.getElementById('above').after(img);
      }
    </script>
  </body>
</html>
