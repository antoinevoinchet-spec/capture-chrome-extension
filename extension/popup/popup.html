<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Capture</title>
    <link rel="stylesheet" href="../ui/tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="5.4" fill="#23453b" />
        <rect x="3.5" y="7.7" width="17" height="11.3" rx="1.9" fill="#fff" />
        <path d="M8.7 5.6h6.6l1.4 2.4H7.3z" fill="#fff" />
        <circle cx="12" cy="13.4" r="4" fill="#23453b" />
        <circle cx="12" cy="13.4" r="2.6" fill="#f4c542" />
        <circle cx="18" cy="9.9" r="0.7" fill="#23453b" />
      </svg>
      <span>Capture</span>
    </header>

    <div class="actions">
      <button id="full" class="action primary" type="button">
        <span>
          <span class="action-title">Page entière</span>
          <span class="action-desc">Toute la page, découpée en images nettes</span>
        </span>
        <kbd data-shortcut="capture-full" hidden></kbd>
      </button>
      <button id="visible" class="action" type="button">
        <span>
          <span class="action-title">Partie visible</span>
          <span class="action-desc">Ce qui est affiché à l'écran</span>
        </span>
        <kbd data-shortcut="capture-visible" hidden></kbd>
      </button>
      <button id="pick-block" class="action" type="button">
        <span>
          <span class="action-title">Un bloc</span>
          <span class="action-desc">Une carte, une liste, un article, même plus haut que l'écran</span>
        </span>
        <kbd data-shortcut="capture-pick" hidden></kbd>
      </button>
      <button id="pick-zone" class="action" type="button">
        <span>
          <span class="action-title">Une zone</span>
          <span class="action-desc">Un rectangle tracé à la souris</span>
        </span>
      </button>
    </div>

    <p id="shortcut-hint" class="shortcut-hint" hidden>
      <span id="shortcut-hint-text"></span>
      <button id="set-shortcut" class="inline-link" type="button">Choisir un raccourci</button>
    </p>

    <div id="status" class="status" role="status" hidden>
      <div class="bar"><div id="bar-fill"></div></div>
      <p id="status-text"></p>
    </div>
    <p id="error" class="error" role="alert" hidden></p>

    <div class="links">
      <button id="recent" class="link" type="button">Voir les captures récentes</button>
      <button id="convert" class="link" type="button">Convertir des images</button>
    </div>

    <p class="web-note">Clic droit sur une image d’un site : enregistre-la en PNG ou JPG. Une image animée devient fixe.</p>
    <p id="version" class="version"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
