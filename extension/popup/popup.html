<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Capture</title>
    <link rel="stylesheet" href="../ui/tokens.css" />
    <link rel="stylesheet" href="../ui/components.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <!-- Caché jusqu'à ce que popup.js sache si la page est une vidéo YouTube : rien ne bouge après le premier affichage. -->
  <body class="is-loading">
    <header class="head">
      <span data-logo></span>
      <span class="head-title">Capture</span>
      <button id="shortcuts" class="btn-icon" type="button" aria-label="Raccourcis clavier" title="Raccourcis clavier"><span data-icon="keyboard"></span></button>
    </header>

    <main class="stack">
      <button id="full" class="action-main" type="button">
        <span data-icon="full" data-size="20"></span>
        <span>
          <span class="action-title">Page entière</span>
          <span class="action-desc">Toute la page, découpée en images nettes</span>
        </span>
        <kbd data-shortcut="capture-full" hidden></kbd>
      </button>

      <button id="transcript" class="list-row video-row" type="button" hidden>
        <span data-icon="transcript"></span>
        <span class="list-row-label">Transcription de cette vidéo</span>
        <span data-icon="chevron"></span>
      </button>

      <div class="tiles">
        <button id="visible" class="tile" type="button">
          <span data-icon="visible" data-size="20"></span>
          <span>Visible</span>
          <kbd data-shortcut="capture-visible" hidden></kbd>
        </button>
        <button id="pick-block" class="tile" type="button">
          <span data-icon="block" data-size="20"></span>
          <span>Un bloc</span>
          <kbd data-shortcut="capture-pick" hidden></kbd>
        </button>
        <button id="pick-zone" class="tile" type="button">
          <span data-icon="zone" data-size="20"></span>
          <span>Une zone</span>
        </button>
      </div>

      <!-- Zone de statut, sous les tuiles : quand elle apparaît, seul ce qui est dessous se déplace. -->
      <div class="messages">
      <div id="status" class="status" role="status" hidden>
        <div class="progress"><div id="bar-fill" class="progress-bar"></div></div>
        <div class="status-line">
          <p id="status-text" class="num"></p>
          <button id="cancel" class="btn-quiet" type="button" hidden>Annuler</button>
        </div>
      </div>
      <div id="error" class="banner is-error" role="alert" hidden><span data-icon="error"></span><span id="error-text"></span></div>
      <p id="shortcut-hint" class="banner is-info" hidden>
        <span><span id="shortcut-hint-text"></span> <button id="set-shortcut" class="inline-link" type="button">Choisir un raccourci</button></span>
      </p>
      </div>

      <nav class="list" aria-label="Autres outils">
        <button id="devices" class="list-row" type="button">
          <span data-icon="devices"></span>
          <span class="list-row-label">Téléphone, tablette, ordinateur<span class="list-row-meta">Ouvre la page dans un onglet à part</span></span>
          <span data-icon="chevron"></span>
        </button>
        <button id="convert" class="list-row" type="button">
          <span data-icon="convert"></span>
          <span class="list-row-label">Convertir des images</span>
          <span data-icon="chevron"></span>
        </button>
        <button id="transcribe" class="list-row" type="button">
          <span data-icon="transcript"></span>
          <span class="list-row-label">Transcrire une vidéo</span>
          <span data-icon="chevron"></span>
        </button>
        <button id="recent" class="list-row" type="button">
          <span data-icon="history"></span>
          <span class="list-row-label">Captures récentes</span>
          <span id="recent-count" class="badge recent-count" aria-hidden="true"></span>
          <span data-icon="chevron"></span>
        </button>
      </nav>
    </main>

    <footer class="foot">
      <p id="tip" class="tip" hidden>
        <span title="Clic droit sur une image d’un site : enregistre-la en PNG ou JPG. Une image animée devient fixe.">Clic droit sur une image : PNG ou JPG<span class="visually-hidden">. Une image animée devient fixe.</span></span>
        <button id="tip-close" class="btn-icon tip-close" type="button" aria-label="Fermer l’astuce"><span data-icon="close" data-size="14"></span></button>
      </p>
      <p id="version" class="version num"></p>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
