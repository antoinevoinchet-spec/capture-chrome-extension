<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transcription</title>
    <link rel="stylesheet" href="../ui/tokens.css" />
    <link rel="stylesheet" href="../ui/components.css" />
    <link rel="stylesheet" href="../viewer/viewer.css" />
    <link rel="stylesheet" href="transcript.css" />
  </head>
  <body data-state="empty">
    <header class="app-header">
      <div class="brand"><span data-logo></span><span>Capture</span></div>
      <div class="heading">
        <h1 id="title" class="app-header-title">Transcription</h1>
        <p id="summary" class="meta num"></p>
      </div>
      <div class="app-header-actions">
        <div id="format" class="segmented" role="group" aria-label="Format de la copie" hidden></div>
        <button id="copy" class="btn-primary" type="button" hidden>Copier</button>
        <div class="downloads" role="group" aria-label="Télécharger">
          <button id="save-md" class="btn-secondary" type="button" hidden>.md</button>
          <button id="save-txt" class="btn-secondary" type="button" hidden>.txt</button>
          <button id="save-srt" class="btn-secondary" type="button" hidden>.srt</button>
        </div>
      </div>
    </header>

    <div class="app-body">
      <aside class="app-side panel">
        <section>
          <h2><label for="lang">Langue</label></h2>
          <select id="lang" class="select" disabled>
            <option value="">Langue de la vidéo</option>
          </select>
          <p class="hint">Changer de langue relit la vidéo.</p>
        </section>
        <section>
          <h2 id="times-label">Repères de temps</h2>
          <div id="times" class="segmented" role="group" aria-labelledby="times-label"></div>
          <p id="files-hint" class="hint" hidden>Le .md est toujours en Markdown, le .txt toujours en texte simple.</p>
        </section>
        <p class="transcript-note">Lue dans un onglet caché et muet : ton onglet YouTube n’est pas touché, rien ne quitte ton navigateur.</p>
      </aside>

      <main class="app-main mat transcript-mat">
        <form id="link-form" class="link-form" novalidate>
          <label for="link" class="link-label">Colle le lien d’une vidéo YouTube</label>
          <div class="link-row">
            <input id="link" class="input" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://www.youtube.com/watch?v=…" />
            <button id="read" class="btn-primary" type="submit">Transcrire</button>
          </div>
        </form>

        <div id="loading" class="status num" role="status" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span id="loading-text">Lecture de la transcription…</span>
          <button id="cancel" class="btn-secondary" type="button">Annuler</button>
        </div>

        <div id="problem" class="banner is-error problem" role="alert" hidden>
          <p id="problem-text"></p>
          <button id="allow" class="btn-primary" type="button" hidden>Autoriser l’accès à YouTube</button>
        </div>

        <p id="incomplete" class="banner is-info incomplete" hidden></p>
        <pre id="preview" class="preview num" tabindex="0" aria-label="Aperçu de la transcription" hidden></pre>
      </main>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="transcript.js"></script>
  </body>
</html>
