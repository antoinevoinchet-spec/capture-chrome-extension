<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Captures</title>
    <link rel="stylesheet" href="../ui/tokens.css" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <rect width="24" height="24" rx="5.4" fill="#23453b" />
          <rect x="3.5" y="7.7" width="17" height="11.3" rx="1.9" fill="#fff" />
          <path d="M8.7 5.6h6.6l1.4 2.4H7.3z" fill="#fff" />
          <circle cx="12" cy="13.4" r="4" fill="#23453b" />
          <circle cx="12" cy="13.4" r="2.6" fill="#f4c542" />
          <circle cx="18" cy="9.9" r="0.7" fill="#23453b" />
        </svg>
        <span>Capture</span>
      </div>
      <div class="heading">
        <h1 id="title">Captures</h1>
        <p id="meta" class="meta"></p>
      </div>
      <div class="top-actions">
        <button id="copy-current" class="btn-secondary" type="button" disabled>Copier l’image</button>
        <button id="download-all" class="btn-primary" type="button" disabled>Tout télécharger</button>
      </div>
    </header>

    <div class="layout">
      <aside class="panel">
        <section>
          <h2 id="split-label">Découpage</h2>
          <div id="split" class="segmented" role="group" aria-labelledby="split-label"></div>
          <p id="split-hint" class="hint"></p>
        </section>
        <section>
          <h2 id="format-label">Format</h2>
          <div id="format" class="segmented" role="group" aria-labelledby="format-label"></div>
          <p id="format-hint" class="hint"></p>
        </section>
        <section>
          <h2>Captures récentes</h2>
          <ul id="history" class="history"></ul>
        </section>
      </aside>

      <main id="mat" class="mat">
        <p id="notice" class="notice" hidden>
          Page très longue : la capture s'arrête à 100 000 points de haut.
        </p>
        <div id="parts" class="parts"></div>
      </main>
    </div>

    <div id="image-menu" class="image-menu" role="menu" hidden>
      <button type="button" role="menuitem" data-action="copy">Copier l’image en pleine résolution</button>
      <button type="button" role="menuitem" data-action="download">Télécharger l’image</button>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="viewer.js"></script>
  </body>
</html>
